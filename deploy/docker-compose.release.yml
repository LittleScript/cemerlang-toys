services:
  cemerlang-toys:
    image: cemerlang-toys:${RELEASE_TAG:?RELEASE_TAG must be set}
    container_name: cemerlang-toys
    restart: unless-stopped
    init: true
    env_file:
      - /opt/cemerlang-secrets/app.env
      - /opt/cemerlang-secrets/runtime.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    volumes:
      - /opt/cemerlang-toys/uploads:/app/public/uploads
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  proxy:
    external: true
    name: proxy
